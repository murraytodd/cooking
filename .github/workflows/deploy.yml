name: Deployment Workflow
on:
  push:
    branches: [ main ]

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Fixes the Node.js 20 warning

      - name: Update modification date
        run: |
          # Use find to safely execute sed on all HTML files
          # This prevents "file not found" errors if the wildcard fails
          CURRENT_DATE=$(date +'%m/%d/%Y')
          # Using | instead of / as the delimiter
          find . -maxdepth 1 -name "*.html" -exec sed -i "s|{{LAST_MODIFIED}}|$CURRENT_DATE|g" {} +

      - name: Deploy to website
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlDzvc -i"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}